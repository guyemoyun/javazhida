spring.application.name=zhida
spring.web.resources.cache.period=0

# 所有服务商均使用兼容 OpenAI 的 /chat/completions 协议。
chat.providers.openai.name=OpenAI\uFF08\u5F00\u653E\u4EBA\u5DE5\u667A\u80FD\uFF09
chat.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
chat.providers.openai.api-key=${OPENAI_API_KEY:}
chat.providers.openai.model=${OPENAI_MODEL:gpt-4o-mini}

chat.providers.deepseek.name=DeepSeek\uFF08\u6DF1\u5EA6\u6C42\u7D22\uFF09
chat.providers.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
chat.providers.deepseek.api-key=${DEEPSEEK_API_KEY:}
chat.providers.deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

chat.providers.qwen.name=Qwen\uFF08\u901A\u4E49\u5343\u95EE\uFF09
chat.providers.qwen.base-url=${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
chat.providers.qwen.api-key=${QWEN_API_KEY:}
chat.providers.qwen.model=${QWEN_MODEL:qwen-plus}
